name: Generate profile summary cards

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: profile-repository-write
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Generate GitHub statistics
        uses: vn7n24fzkq/github-profile-summary-cards@release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          USERNAME: santana-iago
          BRANCH_NAME: main
          UTC_OFFSET: "-03:00"
          THEME: github_dark
          AUTO_PUSH: false
          EXCLUDE: ""

      - name: Commit statistics
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # The card-generating action also rewrites profile-summary-card-output/README.md;
          # keep our own documentation there instead of the tool's default preview markdown.
          git checkout -- profile-summary-card-output/README.md 2>/dev/null || true
          git add profile-summary-card-output
          if git diff --cached --quiet; then
            echo "No statistics changes."
            exit 0
          fi
          git commit -m "chore: update profile statistics [skip ci]"
          git pull --rebase origin main
          git push

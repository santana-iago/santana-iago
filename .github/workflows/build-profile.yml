name: Build profile assets

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "profile.yml"
      - "scripts/**"
      - "assets/brands/**"
      - "assets/icons/**"
      - "requirements.txt"

permissions:
  contents: write

concurrency:
  group: profile-repository-write
  cancel-in-progress: false

jobs:
  build:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Run tests
        run: python scripts/test_build_profile.py -v

      - name: Generate profile
        run: python scripts/build_profile.py

      - name: Validate repository
        run: python scripts/validate_profile.py

      - name: Commit generated files
        shell: bash
        run: |
          if git diff --quiet; then
            echo "No generated changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md assets/generated docs REPOSITORY-CONTENTS.txt
          git commit -m "chore: rebuild profile assets [skip ci]"
          git pull --rebase origin main
          git push

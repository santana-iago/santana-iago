.hero-headline{font:italic 600 34px Georgia,'Times New Roman',serif;fill:#f0f6fc}
.hero-headline-mobile{font:italic 600 21px Georgia,'Times New Roman',serif;letter-spacing:-.1px;fill:#f0f6fc}
.hero-copy{font:400 13px ui-monospace,SFMono-Regular,Menlo,Monaco,Consolas,monospace;fill:#9aa4b2}
